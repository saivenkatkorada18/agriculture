version: "1"
services:
  # ----------------------------------------------------
  # 1. FastAPI Python Backend Service
  # ----------------------------------------------------
  - type: web
    name: agriculture-backend
    env: python
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CONFIDENCE_THRESHOLD
        value: "0.60"
      - key: GEMINI_API_KEY
        sync: false

  # ----------------------------------------------------
  # 2. React Vite Frontend Static Site
  # ----------------------------------------------------
  - type: web
    name: agriculture-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
